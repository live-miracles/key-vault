name: Build and deploy

# Checks every push and pull request, and publishes the mock-backed demo to GitHub Pages
# from master. The real site is built and deployed by Vercel from the same repository;
# Supabase is deployed by deploy-supabase.yml.
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: pages-deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run unit tests
              run: npm test

            - name: Type check
              run: npm run typecheck

            - name: Build CSS
              run: npm run css

            - name: Build demo site
              run: npm run pages

            - name: Build the site for Vercel
              env:
                  KEY_VAULT_SUPABASE_URL: https://ci-placeholder.supabase.co
                  KEY_VAULT_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
              run: npm run build:vercel

            - name: Deploy to gh-pages
              if: github.event_name != 'pull_request'
              uses: peaceiris/actions-gh-pages@v4.1.0
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ./site
