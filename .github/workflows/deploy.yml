name: Build and deploy

# Checks every push and pull request. The real site is built and deployed by Vercel from
# the same repository; Supabase is deployed by deploy-supabase.yml.
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run unit tests
              run: npm test

            - name: Type check
              run: npm run typecheck

            # Applies every migration to a fresh Postgres in Docker and checks the schema and
            # the SQL functions.
            - name: Check the database migrations
              run: npm run test:db

            - name: Build the demo site
              run: npm run build:demo

            - name: Build the site for Vercel
              env:
                  KEY_VAULT_SUPABASE_URL: https://ci-placeholder.supabase.co
                  KEY_VAULT_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
              run: npm run build
