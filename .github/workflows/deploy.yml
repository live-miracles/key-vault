name: Build and deploy

# Checks every push and pull request. The real site is built and deployed by Vercel from
# the same repository; Supabase is deployed by deploy-supabase.yml.
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run unit tests
              run: npm test

            - name: Type check
              run: npm run typecheck

            - name: Build CSS
              run: npm run css

            - name: Build the site for Vercel
              env:
                  KEY_VAULT_SUPABASE_URL: https://ci-placeholder.supabase.co
                  KEY_VAULT_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
              run: npm run build:vercel
