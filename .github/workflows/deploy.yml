name: Build and deploy

on:
    push:
        branches:
            - master
        tags:
            - 'v*'
    pull_request:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: pages-deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Run unit tests
              run: npm test

            - name: Type check
              run: npm run typecheck

            - name: Check release version
              if: startsWith(github.ref, 'refs/tags/v')
              run: npm run version:check -- "$GITHUB_REF_NAME"

            - name: Build CSS
              run: npm run css

            - name: Build demo site
              run: npm run pages

            - name: Deploy to gh-pages
              if: github.event_name != 'pull_request'
              uses: peaceiris/actions-gh-pages@v4.1.0
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ./site

            - name: Build Apps Script project
              if: startsWith(github.ref, 'refs/tags/v')
              run: npm run apps-script:build

            - name: Configure clasp
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
                  APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
              run: |
                  printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
                  chmod 600 ~/.clasprc.json
                  printf '{"scriptId":"%s","rootDir":".clasp-build"}\n' "$APPS_SCRIPT_ID" > .clasp.json

            - name: Verify Apps Script files
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  FILE_STATUS=$(npx clasp --json show-file-status)
                  echo "$FILE_STATUS"
                  FILE_STATUS="$FILE_STATUS" node -e "const data = JSON.parse(process.env.FILE_STATUS); const files = data.filesToPush || []; for (const required of ['Code.js', 'access.js', 'appsscript.json', 'Index.html']) { if (!files.some(file => file.endsWith(required))) throw new Error('Missing required Apps Script file: ' + required); }"

            - name: Deploy Apps Script
              if: startsWith(github.ref, 'refs/tags/v')
              env:
                  APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
              run: |
                  npx clasp push --force
                  VERSION_OUTPUT=$(npx clasp --json version "$GITHUB_REF_NAME")
                  echo "$VERSION_OUTPUT"
                  VERSION_NUMBER=$(VERSION_OUTPUT="$VERSION_OUTPUT" node -e "const data = JSON.parse(process.env.VERSION_OUTPUT || '{}'); process.stdout.write(String(data.versionNumber || ''));")
                  test -n "$VERSION_NUMBER"
                  npx clasp deploy --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" --versionNumber "$VERSION_NUMBER" --description "$GITHUB_REF_NAME"
